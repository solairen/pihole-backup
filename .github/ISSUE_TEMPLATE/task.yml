name: Task
description: What should be added?
title: "[Task]: "
labels: ["task"]
assignees:
  - solairen
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this task report.
  - type: textarea
    id: task-set
    attributes:
      label: What should be added?
      placeholder: Describe how it should work
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: What component does this task refer to?
      options:
        - Code
        - Pi-hole (teleporter API/login)
        - Storage S3
        - Storage Azure Blob
        - CI/CD
        - Docker
        - Devcontainer
        - Documentation
        - Other
    validations:
      required: true
