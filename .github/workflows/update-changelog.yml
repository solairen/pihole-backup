name: Update Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
    - name: Disable ruleset in repository
      uses: solairen/ruleset-trigger@1.0.5
      with:
        token: ${{ secrets.GHCR_PASSWORD }}
        ruleset_id: ${{ secrets.RULESET_ID }}
        repository: ${{ github.repository }}
        enforcement: "disabled"

    - name: Changelog Update
      uses: bcsizmadia/changelog_update@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit_message: "Update changelog for ${{ github.event.release.tag_name }}"

    - name: Enable ruleset in repository
      uses: solairen/ruleset-trigger@1.0.5
      with:
        token: ${{ secrets.GHCR_PASSWORD }}
        ruleset_id: ${{ secrets.RULESET_ID }}
        repository: ${{ github.repository }}
        enforcement: "active"
